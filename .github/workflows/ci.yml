name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install core and independent replay tools
        run: |
          python -m pip install -r requirements-dev.txt pytrec-eval-terrier==0.5.11 tokenizers==0.23.3
          python -m pip check
      - name: Lint, type check, and test evaluation and artifact replay
        run: |
          ruff check .
          ruff format --check .
          mypy
          python -m pytest -q
          python -m benchmarks.verify --gate
      - name: Smoke test an installed wheel and its regression status outside checkout
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels"
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install "$RUNNER_TEMP"/wheels/*.whl
          cd "$RUNNER_TEMP"
          cli="$RUNNER_TEMP/smoke/bin/ragbench"
          printf '%s\n' '{"q1":["red"],"q2":["blue"]}' > references.json
          printf '%s\n' '{"q1":"red","q2":"blue"}' > good.json
          printf '%s\n' '{}' > missing.json
          for run in good missing; do
            "$cli" answers --references references.json --predictions "$run.json" --dataset-id fixture --split-id smoke --output "$run-eval.json"
          done
          status=0
          "$cli" compare good-eval.json missing-eval.json --metric token_f1 --margin .02 --output gate.json || status=$?
          test "$status" -eq 1
          smoke/bin/python -c 'import json; assert json.load(open("gate.json"))["gate"] == "regression"'
          "$cli" score --qrels "$GITHUB_WORKSPACE/tests/fixtures/graded.tsv" --run "$GITHUB_WORKSPACE/tests/fixtures/ranking.trec" --dataset-id fixture --split-id smoke --output retrieval.json

  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test web/tests/*.test.mjs
